# silently fall back to targetSdk and fail with "API level 36 is not available" — Robolectric
# ships no shadow jar for it. Replaces the per-class `@Config(sdk = [35])` this module's six
# Robolectric classes carried before (whole-branch review fix round): a per-class pin left the
# NEXT Robolectric test added here defaulting to targetSdk and failing unexplained, exactly the
# gap :core:database/:core:data/:core:designsystem/:core:network/:feature:library/
# :feature:discover/:feature:favorites already closed this same way. Copied from those.
sdk=35
