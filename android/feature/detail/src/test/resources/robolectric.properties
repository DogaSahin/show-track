# Module-wide default for every Robolectric test class here, so a second test class doesn't
# silently fall back to targetSdk and fail with "API level 36 is not available" — Robolectric
# ships no shadow jar for it. Copied from :feature:feed / :feature:groups / :feature:favorites /
# :feature:library. DetailViewModelTest still carries its own per-class @Config(sdk = [35]) — it
# predates this file and removing it is not this task's to do — but DetailScreenTest (task 9c.6)
# relies on this file rather than repeating that annotation.
sdk=35
