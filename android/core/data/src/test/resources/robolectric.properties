# 35, not this module's compileSdk (36): robolectric 4.15.1 ships no shadow jar for API 36 and
# fails with `IllegalArgumentException: API level 36 is not available`. Robolectric picks its
# platform independently of compileSdk, so compiling against 36 and testing against 35 is its
# normal arrangement. Module-wide rather than @Config per class, so the next Robolectric test
# added here inherits the pin instead of rediscovering the failure.
sdk=35
