name: backend-ci

on:
  pull_request:
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'
  push:
    branches: [dev, main]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'

defaults:
  run:
    working-directory: backend

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: showtrack
          POSTGRES_PASSWORD: showtrack
          POSTGRES_DB: showtrack
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U showtrack -d showtrack"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+asyncpg://showtrack:showtrack@localhost:5432/showtrack

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: '3.12'

      # A venv, not `--system`: the runner's system interpreter is Debian-packaged and
      # marked EXTERNALLY-MANAGED (PEP 668), which uv honours and refuses to install into.
      # This also makes CI run the same `.venv/bin/...` commands as the documented local gate.
      # --python is explicit on purpose: setup-uv exports UV_SYSTEM_PYTHON, which makes a
      # bare `uv pip install` ignore the venv we just created and target the runner's
      # system interpreter, leaving .venv/bin empty. Naming the interpreter overrides it.
      - name: Install dependencies
        run: |
          echo "cwd=$(pwd)"
          uv --version
          env | grep -i '^UV_' || echo "(no UV_* variables set)"
          uv venv
          uv pip install --python .venv/bin/python -r requirements-dev.txt
          echo "--- .venv/bin after install ---"
          ls -la .venv/bin || echo "NO .venv/bin DIRECTORY"
          test -x .venv/bin/ruff || { echo "FATAL: ruff absent from .venv/bin"; exit 1; }

      - name: Lint
        run: |
          echo "cwd=$(pwd)"
          ls -la .venv/bin/ruff || echo "ruff missing at lint time"
          .venv/bin/ruff check .
          .venv/bin/ruff format --check .

      - name: Apply migrations
        run: .venv/bin/alembic upgrade head

      - name: Test
        run: .venv/bin/pytest -v
