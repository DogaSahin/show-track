name: android-ci

on:
  pull_request:
    paths:
      - 'android/**'
      - '.github/workflows/android-ci.yml'
  push:
    branches: [dev, main]
    paths:
      - 'android/**'
      - '.github/workflows/android-ci.yml'

# Every job in this workflow only reads the repository, so the token is pinned to exactly
# that rather than left to inherit whatever the repository or organisation default is set to.
# Widen per-job only if a step actually fails for lack of a permission.
permissions:
  contents: read

defaults:
  run:
    working-directory: android

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew testDebugUnitTest

      - name: Assemble debug
        run: ./gradlew assembleDebug
