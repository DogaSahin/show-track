name: android-ci

on:
  pull_request:
    paths:
      - 'android/**'
      - '.github/workflows/android-ci.yml'
  push:
    branches: [dev, main]
    paths:
      - 'android/**'
      - '.github/workflows/android-ci.yml'

# Every job in this workflow only reads the repository, so the token is pinned to exactly
# that rather than left to inherit whatever the repository or organisation default is set to.
# Widen per-job only if a step actually fails for lack of a permission.
permissions:
  contents: read

defaults:
  run:
    working-directory: android

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Lint
        run: ./gradlew ktlintCheck detekt

      # Also runs the build-logic convention-plugin tests, including the ones that prove the
      # module-dependency rules fail a real build. See android/build.gradle.kts.
      - name: Unit tests
        run: ./gradlew testDebugUnitTest

      # assembleDebugAndroidTest alongside assembleDebug: :core:network has an instrumentation
      # test for the Android Keystore, which has no off-device stand-in. Nothing here can RUN it
      # (there is no emulator in this pipeline), but without compiling it the androidTest source
      # set is never built by anything and would rot silently on the first refactor.
      # (:core:database's Room DAO test runs on Robolectric instead, so it's exercised by the
      # unit-test step above, not by this one.)
      - name: Assemble debug
        run: ./gradlew assembleDebug assembleDebugAndroidTest
