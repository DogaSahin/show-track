name: showtrack

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: showtrack
      POSTGRES_PASSWORD: showtrack
      POSTGRES_DB: showtrack
    ports:
      - "5432:5432"
    volumes:
      - showtrack-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U showtrack -d showtrack"]
      interval: 5s
      timeout: 3s
      retries: 10

  ntfy:
    image: binwiederhier/ntfy:latest
    command: serve
    environment:
      # Topics are unguessable secrets generated server-side (6-L), but defence in depth:
      # deny-all means a leaked topic is still useless without a token. The consequence is that
      # the BACKEND cannot publish without one either — mint a user and a token before setting
      # NTFY_TOKEN. The README's Notifications section has the two commands.
      NTFY_AUTH_DEFAULT_ACCESS: deny-all
      # Where the user/token database lives. Named explicitly because deny-all without an
      # auth-file leaves a server nobody, including the backend, can publish to.
      NTFY_AUTH_FILE: /var/lib/ntfy/user.db
      NTFY_BASE_URL: http://localhost:8080
    volumes:
      - ntfy-data:/var/lib/ntfy
    ports:
      - "8080:80"

  api:
    build: .
    # Bash does not export UID, and GID is not a bash variable at all, so Compose never
    # sees either from the environment: this always resolves to the literal 1000:1000
    # default (`docker compose config` confirms it), which only matches this machine's
    # uid. A developer with a different uid must `export UID` and `export GID` (e.g. in
    # their shell profile) before running compose for files to land with their own uid.
    user: "${UID:-1000}:${GID:-1000}"
    environment:
      DATABASE_URL: postgresql+asyncpg://showtrack:showtrack@db:5432/showtrack
      LOG_LEVEL: INFO
      ENVIRONMENT: local
      SECRET_KEY: change-me-use-openssl-rand-hex-32
      REGISTRATION_CODE: change-me
      TMDB_API_KEY: ${TMDB_API_KEY:-}
      # Passed through from the host environment, empty by default, exactly like TMDB_API_KEY.
      # Empty means no transport, so the dispatch job is never registered and tasks queue as
      # `pending` — the intended posture for anyone who has not set ntfy up. From INSIDE this
      # network the ntfy service is `http://ntfy`, not `http://localhost:8080`; the latter is
      # only correct for uvicorn running on the host, which is the documented dev flow.
      NTFY_BASE_URL: ${NTFY_BASE_URL:-}
      NTFY_TOKEN: ${NTFY_TOKEN:-}
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    depends_on:
      db:
        condition: service_healthy

volumes:
  showtrack-pgdata:
  ntfy-data:
