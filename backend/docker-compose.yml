services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: showtrack
      POSTGRES_PASSWORD: showtrack
      POSTGRES_DB: showtrack
    ports:
      - "5432:5432"
    volumes:
      - showtrack-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U showtrack -d showtrack"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    environment:
      DATABASE_URL: postgresql+asyncpg://showtrack:showtrack@db:5432/showtrack
      LOG_LEVEL: INFO
      ENVIRONMENT: local
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    depends_on:
      db:
        condition: service_healthy

volumes:
  showtrack-pgdata:
