# This file is the PRODUCTION shape, and `docker-compose.override.yml` — which Compose loads
# automatically when it is present — adds back the things only development wants (a bind-mounted
# source tree, the auto-reloader, a published Postgres port).
#
# That ordering is deliberate and it is about the failure mode. The obvious alternative, a
# `docker-compose.prod.yml` selected with `-f`, means that forgetting the flag on the server
# silently starts production with whatever the base file happens to say — and the base file used
# to say `SECRET_KEY: change-me-use-openssl-rand-hex-32`. With production as the base, the worst a
# forgotten flag can do is mount a source directory; it cannot hand out forgeable tokens.
#
# The `${VAR:?message}` form is the other half: Compose REFUSES to start when one is unset, so a
# missing secret is a loud error at `up` rather than a default nobody chose. Copy `.env.example`
# to `.env` and fill it in before the first run — in development too, which is new: the values
# these interpolate used to be hardcoded here.
#
# On the server, run without the development override:
#     docker compose -f docker-compose.yml up -d --build
name: showtrack

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: showtrack
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: showtrack
    # No published port. Nothing outside this compose network needs to reach Postgres directly;
    # the development override republishes it, because the documented dev gate runs alembic and
    # pytest from the host venv against localhost:5432.
    volumes:
      - showtrack-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U showtrack -d showtrack"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      target: runtime
    restart: unless-stopped
    environment:
      # Composed here rather than read from .env, and the distinction matters: .env's own
      # DATABASE_URL points at localhost:5432 for host-run uvicorn/alembic/pytest, while a
      # container reaches Postgres at `db`. Interpolating just the password keeps one secret in
      # one place without the two URLs fighting over the same variable name.
      DATABASE_URL: postgresql+asyncpg://showtrack:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/showtrack
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      ENVIRONMENT: ${ENVIRONMENT:-production}
      SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY in .env — openssl rand -hex 32}
      REGISTRATION_CODE: ${REGISTRATION_CODE:?set REGISTRATION_CODE in .env — openssl rand -hex 32}
      TMDB_API_KEY: ${TMDB_API_KEY:-}
    # Migrations run here rather than in a separate one-shot service, and the reason is reboots.
    # `depends_on` orders `docker compose up`; it does NOT order the restart policy, so after a
    # host reboot the api container can start before Postgres is accepting connections. Inline,
    # that is self-healing: alembic fails, the container exits, `restart: unless-stopped` brings
    # it back, and it succeeds once the database is up. A separate migrate service would instead
    # leave the api running against an unmigrated schema.
    #
    # Safe to run on every start — alembic upgrade head is a no-op once the schema is current.
    # This is also why there is exactly one api replica: two would race here (architecture rule 6
    # already pins the app to one for the in-process scheduler).
    command: sh -c "alembic upgrade head && exec uvicorn main:app --host 0.0.0.0 --port 8000"
    # Loopback only: `tailscale serve` terminates TLS on the host and proxies here, so binding
    # anywhere wider would publish plaintext HTTP to the LAN alongside the TLS endpoint. Android blocks cleartext by default and this app ships no exemption, so the
    # TLS endpoint is not optional and this port must not be a second way in around it.
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  showtrack-pgdata:
