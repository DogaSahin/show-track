[tool.ruff]
line-length = 120
target-version = "py312"
# extend-exclude, not exclude: `exclude` REPLACES ruff's built-in list (.venv, __pycache__,
# build, ...), which left the virtualenv lintable outside a git checkout.
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
# One event loop for the whole run, so the session-scoped `engine` fixture is coherent.
# Measured: dropping the fixture scope gives ScopeMismatch at setup; dropping the test scope
# gives "Task got Future attached to a different loop". Both hit the first test to use it.
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
